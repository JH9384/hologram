name: Holo Lab UEFI drift diagnostic

on:
  push:
    branches:
      - holo-lab/uefi-drift-diagnostic-2026-10-06
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  uefi-drift:
    name: UEFI witness · ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Rust 1.98.1 baseline
            rust: "1.98.1"
            rustflags: ""
            artifact: "1.98.1"
          - label: Rust 1.99.0 unmodified
            rust: "1.99.0"
            rustflags: ""
            artifact: "1.99.0"
          - label: Rust 1.99.0 disable wcslen idiom
            rust: "1.99.0"
            rustflags: "-C llvm-args=-disable-loop-idiom-wcslen"
            artifact: "1.99.0-no-wcslen-idiom"
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup explicit Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: x86_64-unknown-uefi

      - name: Install QEMU + OVMF
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list                      /etc/apt/sources.list.d/azure-cli.list                      /etc/apt/sources.list.d/azure-cli.sources || true
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Record environment
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            rustc --version --verbose
            cargo --version
            qemu-system-x86_64 --version
            dpkg-query -W -f='ovmf=${Version}\n' ovmf
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            echo "RUSTFLAGS=${RUSTFLAGS}"
          } | tee "uefi-env-${{ matrix.artifact }}.txt"

      - name: Build UEFI binary separately
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo build --release --target x86_64-unknown-uefi             --manifest-path crates/hologram-efi/Cargo.toml             2>&1 | tee "uefi-build-${{ matrix.artifact }}.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Boot exact repository witness
        if: steps.build.outcome == 'success'
        run: ./scripts/uefi-boot-test.sh

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uefi-diagnostic-${{ matrix.artifact }}
          path: |
            uefi-env-${{ matrix.artifact }}.txt
            uefi-build-${{ matrix.artifact }}.log
          if-no-files-found: error
